services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    env_file:
      - path: .env.docker
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trade_proposer}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-trade_proposer}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    build: .
    restart: "no"
    env_file:
      - path: .env.docker
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-trade_proposer}
    command: ["python", "-m", "trade_proposer_app.migrations"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    volumes:
      - ./.prod-run/workers:/app/.prod-run/workers
    env_file:
      - path: .env.docker
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-trade_proposer}
      API_INSTANCE_ID: ${API_INSTANCE_ID:-api-main}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build: .
    restart: unless-stopped
    mem_limit: ${WORKER_MEM_LIMIT:-1536m}
    cpus: ${WORKER_CPUS:-1.50}
    volumes:
      - ./.prod-run/workers:/app/.prod-run/workers
    env_file:
      - path: .env.docker
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-trade_proposer}
    command: ["python", "-m", "trade_proposer_app.workers.tasks"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  scheduler:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env.docker
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-trade_proposer}
      SCHEDULER_INSTANCE_ID: ${SCHEDULER_INSTANCE_ID:-scheduler-main}
    command: ["python", "-m", "trade_proposer_app.scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
